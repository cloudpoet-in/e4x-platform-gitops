name: Keycloak
issuer: $argocd-oidc-secret:ISSUER_URL
clientID: $argocd-oidc-secret:CLIENT_ID
clientSecret: $argocd-oidc-secret:CLIENT_SECRET
cliClientID: $argocd-oidc-secret:CLI_CLIENT_ID
# The MCP server signs users in through its own public PKCE client
# (argocd-mcp), separate from argocd-cli, so tokens come back with a
# different aud. Argo CD only accepts tokens whose audience is the web
# client ID by default - list every client ID issuing tokens it must
# accept here.
allowedAudiences:
  - $argocd-oidc-secret:CLIENT_ID
  - $argocd-oidc-secret:CLI_CLIENT_ID
  - $argocd-oidc-secret:MCP_CLIENT_ID
requestedScopes:
  - openid
  - profile
  - email
logoutURL: https://auth.cloudpoet.in/realms/cloudpoet/protocol/openid-connect/logout
