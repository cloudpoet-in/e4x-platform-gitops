apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - install.yaml

# argocd-cm `url` is deliberately NOT set here. It is the one per-cluster value
# (the FQDN Argo CD is reached at), so e4x-platform-bootstrap injects it as a
# kustomize patch on the argo-cd Application from its `argocd_fqdn` variable.
configMapGenerator:
  - behavior: merge
    name: argocd-cm
    namespace: argocd
    literals:
      # Lets repo-server render components that use the helmCharts: field in
      # their own kustomization.yaml - without this, every such component fails
      # to sync with "must specify --enable-helm".
      - kustomize.buildOptions=--enable-helm
    # oidc.config is multi-line YAML, awkward as a literal - load it from a file.
    files:
      - oidc.config=argocd-oidc-config.yaml
  # groups comes from the Keycloak client's group-membership protocol mapper
  # (added to the ID token regardless of requested scopes).
  - behavior: merge
    name: argocd-rbac-cm
    namespace: argocd
    literals:
      - policy.default=role:readonly
      - 'scopes=[groups, email]'
    files:
      - policy.csv=argocd-rbac-policy.csv
