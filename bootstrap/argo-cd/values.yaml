# Values for the argo/argo-cd chart. Applied two ways, both reading this
# same file - never diverge by hand-editing one without the other:
#   1. e4x bootstrap's one-time `helm template` install step.
#   2. The self-managing `argo-cd` Application's Helm source (via a second,
#      ref-only git source - Argo CD's documented pattern for loading Helm
#      value files from an external git repo).
#
# `configs.cm.url` is deliberately NOT set here. It is the one per-cluster
# value (the hostname Argo CD is reached at), injected by e4x bootstrap as a
# `valuesObject` merge on top of this file.
#
# Bare minimal on purpose: just enough to get Argo CD running and
# self-managing, with no SSO or custom RBAC yet. Dex, OIDC and RBAC policy
# are a later addition, once the platform also installs an identity
# provider for this to point at.
dex:
  enabled: false
